    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const feed = document.getElementById('feed');
    const isMobile = () => window.matchMedia('(max-width: 768px)').matches
      || (navigator.maxTouchPoints > 0 && window.innerWidth < 900);
    const BATCH = () => (isMobile() ? 12 : 24);
    const SEED = () => (isMobile() ? 24 : 48);
    let pool = shuffle(ITEMS);
    let poolIndex = 0;
    let appending = false;

    function nextItem() {
      if (poolIndex >= pool.length) {
        pool = shuffle(ITEMS);
        poolIndex = 0;
      }
      return pool[poolIndex++];
    }

    function createItem(item) {
      const el = document.createElement('div');
      el.className = 'feed-item';
      el.dataset.link = item.link;
      el.setAttribute('role', 'link');
      el.setAttribute('tabindex', '0');

      if (item.type === 'image') {
        const img = document.createElement('img');
        img.src = item.src;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.draggable = false;
        el.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.muted = true;
        video.defaultMuted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = isMobile() ? 'none' : 'metadata';
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.setAttribute('muted', '');
        const source = document.createElement('source');
        source.src = item.src;
        source.type = item.src.endsWith('.mov') ? 'video/quicktime' : 'video/mp4';
        video.appendChild(source);
        el.appendChild(video);

        const io = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              if (video.readyState < 2) video.load();
              video.play().catch(() => {});
            } else {
              video.pause();
            }
          });
        }, { rootMargin: isMobile() ? '80px' : '200px' });
        io.observe(video);
      }

      // Prefer click; guard against accidental drag-scroll taps on mobile
      let touchX = 0, touchY = 0, moved = false;
      el.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        touchX = t.clientX;
        touchY = t.clientY;
        moved = false;
      }, { passive: true });
      el.addEventListener('touchmove', (e) => {
        const t = e.changedTouches[0];
        if (Math.abs(t.clientX - touchX) > 10 || Math.abs(t.clientY - touchY) > 10) {
          moved = true;
        }
      }, { passive: true });
      el.addEventListener('click', (e) => {
        if (moved) return;
        e.preventDefault();
        _navigateTo(item.link);
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          _navigateTo(item.link);
        }
      });
      return el;
    }

    function appendBatch(n = BATCH()) {
      if (appending) return;
      appending = true;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i++) {
        frag.appendChild(createItem(nextItem()));
      }
      feed.appendChild(frag);
      appending = false;
    }

    // Seed enough content to fill viewport + buffer
    appendBatch(SEED());

    const sentinel = document.getElementById('sentinel');
    const infinite = new IntersectionObserver((entries) => {
      if (entries.some(e => e.isIntersecting)) {
        appendBatch();
      }
    }, { rootMargin: isMobile() ? '600px' : '1200px' });
    infinite.observe(sentinel);

    // Info dropdown
    const navInfo = document.getElementById('nav-info');
    const infoDropdown = document.getElementById('info-dropdown');
    document.getElementById('info-trigger').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      infoDropdown.classList.toggle('open');
    });
    infoDropdown.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', (e) => {
      if (!navInfo.contains(e.target)) infoDropdown.classList.remove('open');
    });
    window.addEventListener('scroll', () => {
      if (infoDropdown.classList.contains('open')) infoDropdown.classList.remove('open');
    }, { passive: true });

    // Page transition
    const _overlay = document.getElementById('page-overlay');
    function _navigateTo(url) {
      _overlay.style.animation = 'none';
      _overlay.style.transition = 'none';
      _overlay.style.opacity = '0';
      void _overlay.offsetHeight;
      _overlay.style.transition = 'opacity 0.5s ease';
      _overlay.style.opacity = '1';
      _overlay.style.pointerEvents = 'all';
      setTimeout(() => { window.location.href = url; }, 500);
    }
    document.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (href && !href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto')) {
        a.addEventListener('click', e => { e.preventDefault(); _navigateTo(href); });
      }
    });
    window.addEventListener('pageshow', e => {
      if (e.persisted) {
        _overlay.style.transition = 'none';
        _overlay.style.opacity = '0';
        _overlay.style.pointerEvents = 'none';
      }
    });
  </script>
</body>
</html>
